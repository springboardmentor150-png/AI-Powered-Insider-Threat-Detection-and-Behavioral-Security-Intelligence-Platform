services:
  # -----------------------------------------------------------------
  # ITBIS FastAPI Backend Service (Docker)
  # -----------------------------------------------------------------
  - type: web
    name: itbis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: itbis-postgres
          property: connectionString
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DATABASE
        value: itbis_production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ALLOWED_ORIGINS
        sync: false

  # -----------------------------------------------------------------
  # ITBIS Next.js Frontend Service (Docker)
  # -----------------------------------------------------------------
  - type: web
    name: itbis-frontend
    runtime: docker
    dockerfilePath: ./frontend/itbis/Dockerfile
    dockerContext: ./frontend/itbis
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  # -----------------------------------------------------------------
  # Managed PostgreSQL Database
  # -----------------------------------------------------------------
  - name: itbis-postgres
    plan: free
    region: oregon
    databaseName: itbis_db
    user: itbis_user
